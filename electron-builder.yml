# ==============================================================================
# electron-builder konfiguracija za Windows .exe pakovanje
# electron-builder configuration for Windows .exe packaging
# ==============================================================================

appId: com.kafic.app
productName: "Kafic App"
copyright: "Copyright © 2025 Kafić Pasaz"

# Direktorijumi / Directories
directories:
  output: dist
  buildResources: build

# Fajlovi koji se pakuju / Files to package
# electron-vite bundluje sve zavisnosti u out/ osim @prisma/client (native module)
# electron-vite bundles all dependencies into out/ except @prisma/client (native module)
files:
  - out/**/*
  - node_modules/@prisma/client/**/*
  - prisma/schema.prisma
  - prisma/prisma/dev.db
  - package.json

# ASAR isključen — Prisma zahteva direktan filesystem pristup .node native modulima
# ASAR disabled — Prisma requires direct filesystem access to .node native modules
asar: false

# extraResources: eksplicitno kopira .prisma direktorijum (zaobilazi glob problem sa dot-folderima)
# extraResources: explicitly copies .prisma directory (bypasses glob issue with dot-folders)
# node_modules/.prisma/client/ sadrži query engine i generisani klijent
# node_modules/.prisma/client/ contains the query engine and generated client
extraResources:
  - from: "node_modules/.prisma"
    to: "app/node_modules/.prisma"

# Windows konfiguracija / Windows configuration
# Ikonica: zameniti build/icon.ico sopstvenom ikonom (256x256 .ico fajl)
# Icon: replace build/icon.ico with your own icon (256x256 .ico file)
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

# NSIS installer konfiguracija / NSIS installer configuration
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: "Kafic Pasaz"
  uninstallDisplayName: "Kafic Pasaz Management"
  createDesktopShortcut: true
  createStartMenuShortcut: true
